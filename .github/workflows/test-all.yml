# Fork-only: the subset of Test All that visual testing depends on, gated off
# react/react-native and on standard runners.
name: Test All

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prebuild_apple_dependencies:
    uses: ./.github/workflows/prebuild-ios-dependencies.yml
    secrets: inherit

  prebuild_react_native_core:
    uses: ./.github/workflows/prebuild-ios-core.yml
    if: ${{ needs.prebuild_apple_dependencies.result == 'success' }}
    with:
      use-hermes-prebuilt: true
    secrets: inherit
    needs: [prebuild_apple_dependencies]

  test_ios_rntester:
    runs-on: macos-15
    needs: [prebuild_apple_dependencies, prebuild_react_native_core]
    if: ${{ needs.prebuild_react_native_core.result == 'success' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run it
        uses: ./.github/actions/test-ios-rntester
        with:
          use-frameworks: false
          use-prebuilds: true
          flavor: Release

  test_visual_ios_rntester:
    needs: test_ios_rntester
    if: ${{ needs.test_ios_rntester.result == 'success' }}
    uses: ./.github/workflows/visual-capture-rntester.yml
    with:
      platform: ios

  build_android:
    runs-on: ubuntu-latest
    container:
      image: reactnativecommunity/react-native-android:latest
      env:
        LC_ALL: C.UTF8
        TERM: 'dumb'
        GRADLE_OPTS: '-Dorg.gradle.daemon=false'
        REACT_NATIVE_DOWNLOADS_DIR: /opt/react-native-downloads
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Android
        uses: ./.github/actions/build-android
        with:
          release-type: dry-run

  test_visual_android_rntester:
    needs: build_android
    if: ${{ needs.build_android.result == 'success' }}
    uses: ./.github/workflows/visual-capture-rntester.yml
    with:
      platform: android
