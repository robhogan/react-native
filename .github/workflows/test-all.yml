# Fork only: a minimal Test All that produces fixture E2E state for testing
# upload-test-results.yml. The first attempt fails, so a rerun exercises a
# second attempt and the overwritten artifact.
name: Test All

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture_e2e_state:
    runs-on: ubuntu-latest
    steps:
      - name: Write fixture results
        run: |
          mkdir -p state other
          cat > state/results.json <<JSON
          {
            "version": 1,
            "flows": {
              "packages/rn-tester/.maestro/alert.yml": {"status": "passed", "attempts": 1},
              "packages/rn-tester/.maestro/button.yml": {"status": "passed", "attempts": ${{ github.run_attempt }}}
            }
          }
          JSON
          echo "not a test result" > other/readme.txt
      - name: Upload fixture state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e_android_rntester_state_release_arm64-v8a_NewArch
          path: state/results.json
          overwrite: true
      - name: Upload an unrelated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rntester-release
          path: other/readme.txt
          overwrite: true
      - name: Fail the first attempt
        if: github.run_attempt == '1'
        run: exit 1
