# Trusted half of RNTester visual regression testing. Runs from the default
# branch after Visual Capture RNTester completes, including for pull requests
# from forks. The capture artifacts are treated as inert data: they are
# validated before any image is decoded, and nothing in them is executed.
#
# Pull requests: compare with the baseline for the base commit (or its
#   nearest ancestor with one), upload a report, and set check runs.
# Pushes to the default branch: as above, then publish the captures as the
#   immutable baseline for that commit.
name: Visual Compare RNTester

on:
  workflow_run:
    workflows: [Visual Capture RNTester]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Serializes baseline publication on the default branch.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event == 'push' && 'main' || github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  OUT_DIR: /tmp/visual-out
  VISUAL_ARTIFACTS_DIR: /tmp/visual-artifacts
  VISUAL_BUCKET: ${{ vars.VISUAL_BUCKET }}
  VISUAL_PUBLIC_BASE_URL: ${{ vars.VISUAL_PUBLIC_BASE_URL }}
  VISUAL_CONFIG: packages/rn-tester/visual-tests/config.json

jobs:
  compare:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup node.js
        uses: ./.github/actions/setup-node
      - name: Install node dependencies
        uses: ./.github/actions/yarn-install
      - name: Download captures
        uses: actions/download-artifact@v7
        with:
          pattern: visual-capture-*
          path: ${{ env.VISUAL_ARTIFACTS_DIR }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAPTURE_EVENT: ${{ github.event.workflow_run.event }}
          CAPTURE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CAPTURE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CAPTURE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CAPTURE_RUN_ID: ${{ github.event.workflow_run.id }}
          CAPTURE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/workflow-scripts/visual/compare-run.js prepare
      - name: Check for files to upload
        id: staged
        run: |
          if [[ -d "$OUT_DIR/upload" ]]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        if: steps.staged.outputs.upload == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.VISUAL_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.VISUAL_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Setup gcloud
        if: steps.staged.outputs.upload == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Upload report and baseline
        if: steps.staged.outputs.upload == 'true'
        run: |
          # Objects are write-once; --no-clobber makes a rerun skip what an
          # earlier attempt already uploaded.
          gcloud storage cp --recursive --no-clobber "$OUT_DIR/upload/*" "gs://$VISUAL_BUCKET/"
          if [[ -d "$OUT_DIR/baseline-images" ]]; then
            gcloud storage cp --recursive --no-clobber "$OUT_DIR/baseline-images/*" "gs://$VISUAL_BUCKET/"
            # A baseline exists once its manifest does, so the manifest goes last.
            gcloud storage cp --recursive --no-clobber "$OUT_DIR/baseline-manifests/*" "gs://$VISUAL_BUCKET/"
          fi
      - name: Report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/workflow-scripts/visual/compare-run.js report
